name: Repository validation

on:
  push:
    branches:
      - main
      - refactor/modular-architecture
  pull_request:
    branches:
      - main

jobs:
  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build frontend with esbuild
        run: npm run build:frontend
      - name: Run unit tests
        run: npm test
      - name: Verify frontend output and integration contracts
        run: npm run verify:frontend
      - name: Verify Cloudflare Worker bundle
        run: npm run verify:backend

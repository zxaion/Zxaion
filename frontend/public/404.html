<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — Page Not Found | ZXAION GALLERY</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" href="/favicon.ico" sizes="any">
    <style>
        :root { color-scheme: dark; }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: radial-gradient(circle at top, #18181b 0%, #09090b 65%);
            color: #f4f4f5;
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, sans-serif;
            padding: 24px;
        }
        main {
            max-width: 460px;
            width: 100%;
            text-align: center;
            background: rgba(24, 24, 27, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 40px 28px;
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.55);
        }
        .code {
            font-size: 64px;
            font-weight: 900;
            line-height: 1;
            letter-spacing: -0.04em;
            background: linear-gradient(135deg, #f59e0b, #ec4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 0 0 12px;
        }
        h1 {
            font-size: 20px;
            font-weight: 800;
            margin: 0 0 10px;
        }
        p {
            font-size: 14px;
            line-height: 1.6;
            color: #a1a1aa;
            margin: 0 0 24px;
        }
        a {
            display: inline-block;
            padding: 12px 24px;
            border-radius: 9999px;
            background: #ffffff;
            color: #09090b;
            font-size: 13px;
            font-weight: 800;
            text-decoration: none;
        }
        a:hover { background: #e4e4e7; }
    </style>
</head>
<body>
    <main>
        <p class="code">404</p>
        <h1>Page Not Found</h1>
        <p>The page you requested does not exist or has been moved on ZXAION GALLERY.</p>
        <a href="/">Back to Gallery</a>
    </main>
</body>
</html>

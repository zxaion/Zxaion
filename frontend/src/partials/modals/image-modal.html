    <!-- ═══════════════════════════════════════════
         IMAGE MODAL
         ═══════════════════════════════════════════ -->
    <div id="image-modal" class="fixed inset-0 z-[100] hidden bg-black/95 backdrop-blur-sm p-4">
        <button id="close-image-modal" class="absolute top-4 right-4 w-10 h-10 bg-white/10 hover:bg-white/20 text-white rounded-full flex items-center justify-center transition-all duration-300 z-50 backdrop-blur-md">
            <i class="fas fa-times"></i>
        </button>

        <div class="h-full flex flex-col lg:flex-row gap-6 max-w-[1800px] mx-auto">

            <!-- Image Wrapper -->
            <div class="flex-1 flex items-center justify-center relative bg-black/50 rounded-2xl overflow-hidden" id="modal-img-wrapper">
                <img
                    id="modal-img"
                    class="max-h-[70vh] lg:max-h-[80vh] max-w-full rounded-xl object-contain select-none"
                    alt="Wallpaper preview"
                    draggable="false"
                    style="-webkit-user-drag:none; -webkit-touch-callout:none; user-select:none;">
                <!-- Shield overlay: aktif untuk DTREASURE yang belum dibeli -->
                <div
                    id="modal-img-shield"
                    class="hidden absolute inset-0 z-10"
                    style="-webkit-tap-highlight-color:transparent;">
                </div>
            </div>

            <!-- Image Details Panel -->
            <div class="lg:w-96 w-full bg-white rounded-2xl p-6 overflow-hidden flex flex-col shadow-2xl dark:bg-gray-800 dark:border dark:border-gray-700">
                <div class="border-b pb-4 dark:border-gray-700">
                    <div class="flex items-center justify-between mb-3">
                        <h3 id="modal-title" class="font-bold text-lg dark:text-white line-clamp-2"></h3>
                        <span id="modal-category" class="text-xs px-3 py-1 bg-gray-100 rounded-full text-gray-600 dark:bg-gray-700 dark:text-gray-400"></span>
                    </div>
                    <div class="flex items-center gap-6 text-sm text-gray-600 dark:text-gray-300">
                        <div class="flex items-center gap-2 bg-green-50 px-3 py-1.5 rounded-full dark:bg-green-900/30">
                            <i class="fas fa-eye text-green-500"></i>
                            <span id="modal-view-count" class="font-semibold">0</span>
                        </div>
                        <div class="flex items-center gap-2 bg-purple-50 px-3 py-1.5 rounded-full dark:bg-purple-900/30">
                            <i class="fas fa-download text-purple-500"></i>
                            <span id="modal-download-count" class="font-semibold">0</span>
                        </div>
                    </div>
                </div>

                <div class="flex-1 overflow-y-auto py-4 space-y-4" style="min-height:0;">
                    <!-- Device Resolution Selector -->
                    <div class="bg-gray-50 dark:bg-gray-900/60 p-3.5 rounded-2xl border border-gray-200 dark:border-gray-700/80">
                        <div class="flex items-center justify-between mb-2.5">
                            <label class="text-xs font-bold uppercase tracking-wider text-gray-700 dark:text-gray-300 flex items-center gap-1.5">
                                <i class="fas fa-display text-amber-500" aria-hidden="true"></i>
                                <span>Download Resolution</span>
                            </label>
                            <span id="resolution-current-badge" class="text-[11px] font-bold px-2.5 py-0.5 rounded-full bg-amber-500/10 text-amber-600 dark:text-amber-400 border border-amber-500/20">
                                Original / 4K
                            </span>
                        </div>

                        <div class="grid grid-cols-2 gap-2" id="resolution-button-group">
                            <!-- 1. Original -->
                            <button
                                type="button"
                                data-resolution="original"
                                class="resolution-btn active text-left p-2.5 rounded-xl border border-amber-500 bg-amber-500/10 text-gray-900 dark:text-white transition-all flex items-center gap-2.5 col-span-2"
                            >
                                <div class="w-8 h-8 rounded-lg bg-amber-500/20 text-amber-600 dark:text-amber-400 flex items-center justify-center shrink-0">
                                    <i class="fas fa-expand text-sm" aria-hidden="true"></i>
                                </div>
                                <div class="flex-1 min-w-0">
                                    <div class="font-bold text-xs flex items-center justify-between">
                                        <span>Original / 4K Ultra HD</span>
                                        <i class="fas fa-check-circle text-amber-500 text-xs resolution-check" aria-hidden="true"></i>
                                    </div>
                                    <div class="text-[10px] text-gray-500 dark:text-gray-400 truncate">Uncompressed original resolution</div>
                                </div>
                            </button>

                            <!-- 2. Desktop 1080p -->
                            <button
                                type="button"
                                data-resolution="desktop"
                                class="resolution-btn text-left p-2.5 rounded-xl border border-gray-200 dark:border-gray-700 hover:border-gray-300 dark:hover:border-gray-600 bg-white dark:bg-gray-800 text-gray-800 dark:text-gray-200 transition-all flex items-center gap-2"
                            >
                                <div class="w-7 h-7 rounded-lg bg-blue-500/10 text-blue-500 flex items-center justify-center shrink-0">
                                    <i class="fas fa-desktop text-xs"></i>
                                </div>
                                <div class="flex-1 min-w-0">
                                    <div class="font-bold text-xs truncate">Desktop</div>
                                    <div class="text-[10px] text-gray-500 dark:text-gray-400">1920 × 1080</div>
                                </div>
                            </button>

                            <!-- 3. Smartphone -->
                            <button
                                type="button"
                                data-resolution="mobile"
                                class="resolution-btn text-left p-2.5 rounded-xl border border-gray-200 dark:border-gray-700 hover:border-gray-300 dark:hover:border-gray-600 bg-white dark:bg-gray-800 text-gray-800 dark:text-gray-200 transition-all flex items-center gap-2"
                            >
                                <div class="w-7 h-7 rounded-lg bg-emerald-500/10 text-emerald-500 flex items-center justify-center shrink-0">
                                    <i class="fas fa-mobile-screen text-xs"></i>
                                </div>
                                <div class="flex-1 min-w-0">
                                    <div class="font-bold text-xs truncate">Smartphone</div>
                                    <div class="text-[10px] text-gray-500 dark:text-gray-400">1080 × 2400</div>
                                </div>
                            </button>

                            <!-- 4. Tablet -->
                            <button
                                type="button"
                                data-resolution="tablet"
                                class="resolution-btn text-left p-2.5 rounded-xl border border-gray-200 dark:border-gray-700 hover:border-gray-300 dark:hover:border-gray-600 bg-white dark:bg-gray-800 text-gray-800 dark:text-gray-200 transition-all flex items-center gap-2"
                            >
                                <div class="w-7 h-7 rounded-lg bg-purple-500/10 text-purple-500 flex items-center justify-center shrink-0">
                                    <i class="fas fa-tablet-screen-button text-xs"></i>
                                </div>
                                <div class="flex-1 min-w-0">
                                    <div class="font-bold text-xs truncate">Tablet / iPad</div>
                                    <div class="text-[10px] text-gray-500 dark:text-gray-400">2048 × 1536</div>
                                </div>
                            </button>

                            <!-- 5. Square -->
                            <button
                                type="button"
                                data-resolution="square"
                                class="resolution-btn text-left p-2.5 rounded-xl border border-gray-200 dark:border-gray-700 hover:border-gray-300 dark:hover:border-gray-600 bg-white dark:bg-gray-800 text-gray-800 dark:text-gray-200 transition-all flex items-center gap-2"
                            >
                                <div class="w-7 h-7 rounded-lg bg-rose-500/10 text-rose-500 flex items-center justify-center shrink-0">
                                    <i class="fas fa-square text-xs"></i>
                                </div>
                                <div class="flex-1 min-w-0">
                                    <div class="font-bold text-xs truncate">Square 1:1</div>
                                    <div class="text-[10px] text-gray-500 dark:text-gray-400">1080 × 1080</div>
                                </div>
                            </button>
                        </div>

                        <p class="text-[11px] text-gray-500 dark:text-gray-400 mt-2.5 flex items-center gap-1.5">
                            <i class="fas fa-circle-info text-[10px] text-amber-500 shrink-0" aria-hidden="true"></i>
                            <span id="resolution-desc-text">Full 4K Ultra HD original file with no extra compression.</span>
                        </p>
                    </div>
                </div>

                <div class="border-t pt-4 dark:border-gray-700 flex items-center gap-3">
                    <a id="download-btn" href="#" class="flex-1 px-4 py-3.5 bg-gradient-to-r from-gray-900 to-black text-white rounded-xl font-bold hover:from-gray-800 hover:to-gray-900 transition-all duration-300 flex items-center justify-center gap-2 shadow-lg hover:shadow-xl hover:scale-[1.02] dark:from-white dark:to-gray-200 dark:text-black">
                        <i class="fas fa-download" aria-hidden="true"></i> Download
                    </a>
                    <button id="share-btn" type="button" aria-label="Share Wallpaper" title="Share wallpaper link" class="px-4 py-3.5 bg-gray-100 hover:bg-gray-200 text-gray-800 dark:bg-gray-700 dark:hover:bg-gray-600 dark:text-white rounded-xl font-bold transition-all duration-200 flex items-center justify-center gap-2 shadow hover:scale-105 active:scale-95">
                        <i class="fas fa-share-nodes text-lg text-amber-500" aria-hidden="true"></i>
                        <span class="hidden sm:inline text-sm">Share</span>
                    </button>
                </div>
            </div>

        </div>
    </div>

    <!-- ═══════════════════════════════════════════
         COMITBASE DIRECT SUBMISSION MODAL
         ═══════════════════════════════════════════ -->
    <div id="comitbase-submit-modal" class="fixed inset-0 z-[170] hidden items-center justify-center p-4 modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="comitbase-submit-title">
        <div class="bg-white dark:bg-gray-900 rounded-3xl w-full max-w-lg overflow-hidden shadow-2xl border border-gray-200/80 dark:border-gray-800">
            <div class="relative bg-gradient-to-r from-teal-600 to-emerald-600 px-6 py-5 text-white">
                <button id="close-comitbase-submit-modal" type="button" aria-label="Close submission modal"
                    class="absolute top-4 right-4 w-9 h-9 bg-white/15 hover:bg-white/25 text-white rounded-full flex items-center justify-center transition-colors cursor-pointer">
                    <i class="fas fa-times" aria-hidden="true"></i>
                </button>
                <div class="text-[11px] font-bold uppercase tracking-widest text-teal-100 flex items-center gap-1.5">
                    <i class="fas fa-handshake" aria-hidden="true"></i>
                    <span>Community Gallery Upload</span>
                </div>
                <h3 id="comitbase-submit-title" class="text-xl font-black mt-1">Submit Artwork to COMITBASE</h3>
            </div>

            <form id="comitbase-submit-form" class="p-6 space-y-4">
                <div>
                    <label for="comitbase-title-input" class="block text-xs font-bold uppercase tracking-wider text-gray-600 dark:text-gray-300 mb-1.5">
                        Artwork Title
                    </label>
                    <input id="comitbase-title-input" type="text" required minlength="2" maxlength="80" placeholder="e.g. Cyber Samurai Dusk"
                        class="w-full px-4 py-2.5 rounded-xl border border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-800 text-sm text-gray-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-teal-500">
                </div>

                <div>
                    <label for="comitbase-creator-input" class="block text-xs font-bold uppercase tracking-wider text-gray-600 dark:text-gray-300 mb-1.5">
                        Artist / Handle (Optional)
                    </label>
                    <input id="comitbase-creator-input" type="text" maxlength="60" placeholder="e.g. @yourhandle or Studio Name"
                        class="w-full px-4 py-2.5 rounded-xl border border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-800 text-sm text-gray-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-teal-500">
                </div>

                <div>
                    <label for="comitbase-file-input" class="block text-xs font-bold uppercase tracking-wider text-gray-600 dark:text-gray-300 mb-1.5">
                        Image File (PNG, JPEG, WebP, GIF · Max 5 MB)
                    </label>
                    <label for="comitbase-file-input" class="block cursor-pointer rounded-2xl border-2 border-dashed border-gray-300 dark:border-gray-700 hover:border-teal-500 dark:hover:border-teal-500 bg-gray-50 dark:bg-gray-800/60 p-4 text-center transition-colors">
                        <input id="comitbase-file-input" type="file" accept="image/png,image/jpeg,image/webp,image/gif" required class="sr-only">
                        <div id="comitbase-upload-placeholder" class="space-y-1.5 py-2">
                            <i class="fas fa-cloud-arrow-up text-2xl text-teal-500" aria-hidden="true"></i>
                            <p class="text-xs font-bold text-gray-700 dark:text-gray-200">Click to choose your artwork image</p>
                            <p id="comitbase-file-meta" class="text-[11px] text-gray-400">Dimensions will be recorded automatically</p>
                        </div>
                        <img id="comitbase-preview-img" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" alt="Submission preview" class="hidden max-h-48 mx-auto rounded-xl object-contain">
                    </label>
                </div>

                <div id="comitbase-submit-error" class="hidden p-3 rounded-xl bg-red-50 dark:bg-red-950/40 border border-red-200 dark:border-red-800 text-xs font-semibold text-red-700 dark:text-red-300"></div>

                <div class="flex items-center justify-end gap-2.5 pt-2">
                    <button type="button" id="comitbase-submit-cancel" class="px-4 py-2.5 rounded-xl bg-gray-100 hover:bg-gray-200 dark:bg-gray-800 dark:hover:bg-gray-700 text-gray-700 dark:text-gray-200 text-xs font-bold transition-colors cursor-pointer">
                        Cancel
                    </button>
                    <button type="submit" id="comitbase-submit-btn" class="px-5 py-2.5 rounded-xl bg-gradient-to-r from-teal-500 to-emerald-500 hover:from-teal-600 hover:to-emerald-600 text-white text-xs font-bold shadow-md transition-all cursor-pointer flex items-center gap-2">
                        <i class="fas fa-paper-plane" aria-hidden="true"></i>
                        <span>Publish to COMITBASE</span>
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- ═══════════════════════════════════════════
         COMITBASE VERIFIED CREATOR APPLICATION MODAL
         ═══════════════════════════════════════════ -->
    <div id="comitbase-submit-modal" class="fixed inset-0 z-[170] hidden items-center justify-center p-4 modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="comitbase-submit-title">
        <div class="bg-white dark:bg-gray-900 rounded-3xl w-full max-w-lg overflow-hidden shadow-2xl border border-gray-200/80 dark:border-gray-800">
            <div class="relative bg-gradient-to-r from-teal-600 to-emerald-600 px-6 py-5 text-white">
                <button id="close-comitbase-submit-modal" type="button" aria-label="Close creator application modal"
                    class="absolute top-4 right-4 w-9 h-9 bg-white/15 hover:bg-white/25 text-white rounded-full flex items-center justify-center transition-colors cursor-pointer">
                    <i class="fas fa-times" aria-hidden="true"></i>
                </button>
                <div class="text-[11px] font-bold uppercase tracking-widest text-teal-100 flex items-center gap-1.5">
                    <i class="fas fa-certificate" aria-hidden="true"></i>
                    <span>Verified Creator Program</span>
                </div>
                <h3 id="comitbase-submit-title" class="text-xl font-black mt-1">Apply as a COMITBASE Creator</h3>
            </div>

            <form id="comitbase-submit-form" class="p-6 space-y-4">
                <p class="text-xs text-gray-600 dark:text-gray-400">
                    Submit your creator details for admin approval. Once approved, your dedicated COMITBASE profile page is generated automatically so you can upload and manage your own collection.
                </p>

                <div>
                    <label for="creator-apply-name" class="block text-xs font-bold uppercase tracking-wider text-gray-600 dark:text-gray-300 mb-1.5">
                        Profile Name <span class="text-rose-500">*</span>
                    </label>
                    <input id="creator-apply-name" type="text" required minlength="2" maxlength="48" placeholder="e.g. Kurogane Atelier"
                        class="w-full px-4 py-2.5 rounded-xl border border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-800 text-sm text-gray-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-teal-500">
                </div>

                <div>
                    <label for="creator-apply-desc" class="block text-xs font-bold uppercase tracking-wider text-gray-600 dark:text-gray-300 mb-1.5">
                        Profile Description <span class="text-rose-500">*</span>
                    </label>
                    <textarea id="creator-apply-desc" rows="3" required minlength="10" maxlength="280" placeholder="Describe your art style, themes, and wallpaper focus (min. 10 characters)..."
                        class="w-full px-4 py-2.5 rounded-xl border border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-800 text-sm text-gray-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-teal-500"></textarea>
                </div>

                <div>
                    <label for="creator-apply-social-1" class="block text-xs font-bold uppercase tracking-wider text-gray-600 dark:text-gray-300 mb-1.5">
                        Primary Social Media Link <span class="text-rose-500">*</span>
                    </label>
                    <input id="creator-apply-social-1" type="url" required placeholder="https://x.com/yourhandle or https://instagram.com/yourhandle"
                        class="w-full px-4 py-2.5 rounded-xl border border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-800 text-sm text-gray-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-teal-500">
                </div>

                <div>
                    <label for="creator-apply-social-2" class="block text-xs font-bold uppercase tracking-wider text-gray-600 dark:text-gray-300 mb-1.5">
                        Secondary Social / Portfolio Link (Optional)
                    </label>
                    <input id="creator-apply-social-2" type="url" placeholder="https://pixiv.net/users/yourid"
                        class="w-full px-4 py-2.5 rounded-xl border border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-800 text-sm text-gray-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-teal-500">
                </div>

                <div id="comitbase-submit-error" class="hidden p-3 rounded-xl bg-red-50 dark:bg-red-950/40 border border-red-200 dark:border-red-800 text-xs font-semibold text-red-700 dark:text-red-300"></div>

                <div class="flex items-center justify-end gap-2.5 pt-2">
                    <button type="button" id="comitbase-submit-cancel" class="px-4 py-2.5 rounded-xl bg-gray-100 hover:bg-gray-200 dark:bg-gray-800 dark:hover:bg-gray-700 text-gray-700 dark:text-gray-200 text-xs font-bold transition-colors cursor-pointer">
                        Cancel
                    </button>
                    <button type="submit" id="comitbase-submit-btn" class="px-5 py-2.5 rounded-xl bg-gradient-to-r from-teal-500 to-emerald-500 hover:from-teal-600 hover:to-emerald-600 text-white text-xs font-bold shadow-md transition-all cursor-pointer flex items-center gap-2">
                        <i class="fas fa-paper-plane" aria-hidden="true"></i>
                        <span>Submit Application</span>
                    </button>
                </div>
            </form>
        </div>
    </div>

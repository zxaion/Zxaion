    <!-- ═══════════════════════════════════════════
         BUY CREDITS MODAL
         ═══════════════════════════════════════════ -->
    <div id="buy-credits-modal" class="fixed inset-0 z-[170] hidden items-center justify-center p-4 modal-backdrop">
        <div class="bg-white rounded-3xl w-full max-w-lg max-h-[90vh] flex flex-col overflow-hidden shadow-2xl dark:bg-gray-900 dark:border dark:border-gray-800">
            <div class="relative shrink-0 bg-gradient-to-r from-amber-400 via-orange-500 to-pink-500 p-6 md:p-8">
                <div class="absolute inset-0 bg-black/10 pointer-events-none"></div>
                <button id="close-buy-credits" type="button" aria-label="Close Buy Credits modal" class="absolute top-4 right-4 z-20 w-10 h-10 bg-white/20 hover:bg-white/30 text-white rounded-full flex items-center justify-center transition-all duration-300 backdrop-blur-sm">
                    <i class="fas fa-times"></i>
                </button>
                <div class="relative z-10 text-center">
                    <div class="w-16 h-16 mx-auto mb-4 bg-white/20 rounded-full flex items-center justify-center backdrop-blur-sm">
                        <i class="fas fa-coins text-3xl text-white"></i>
                    </div>
                    <h3 class="text-2xl md:text-3xl font-black text-white mb-2">Buy Credits</h3>
                    <p class="text-white/90 text-sm">1 download = 10 credits</p>
                </div>
            </div>
            <div class="p-6 flex-1 min-h-0 overflow-y-auto">
                <div id="buy-credits-account-banner" class="mb-4 p-3.5 rounded-2xl bg-gray-50 dark:bg-gray-800/70 border border-gray-200 dark:border-gray-700/80 flex items-center justify-between gap-3">
                    <div class="min-w-0">
                        <div class="text-[10px] font-bold uppercase tracking-wider text-gray-500 dark:text-gray-400">Virtual Account ID</div>
                        <div class="flex items-center gap-2 mt-0.5">
                            <code id="buy-credits-account-id" class="text-xs sm:text-sm font-mono font-extrabold text-amber-600 dark:text-amber-400 truncate">Generating...</code>
                            <span id="buy-credits-account-verified" class="text-[11px] font-semibold text-gray-500 dark:text-gray-400"></span>
                        </div>
                    </div>
                    <button id="buy-credits-open-account-btn" type="button" class="shrink-0 px-3 py-1.5 rounded-xl bg-gray-900 hover:bg-black text-white dark:bg-white dark:text-gray-950 text-xs font-bold transition-colors">
                        Manage Account
                    </button>
                </div>
                <div id="credit-packs" class="space-y-3"></div>
                <!-- PayPal Container -->
                <div id="paypal-button-container" class="mt-6 hidden">
                    <div class="relative">
                        <div class="absolute inset-0 flex items-center">
                            <div class="w-full border-t border-gray-200 dark:border-gray-700"></div>
                        </div>
                        <div class="relative flex justify-center text-sm">
                            <span class="px-2 bg-white text-gray-500 dark:bg-gray-900 dark:text-gray-400">Secure Payment</span>
                        </div>
                    </div>
                    <div id="paypal-buttons" class="mt-4"></div>
                </div>
                <p class="text-xs text-gray-400 mt-4 text-center dark:text-gray-500">
                    <i class="fas fa-shield-alt mr-1"></i> Credits payment non-refundable.
                </p>

                <!-- Account Backup & Restore -->
                <section id="account-recovery-section" class="mt-6 pt-5 border-t border-gray-200 dark:border-gray-800 space-y-3">
                    <div class="flex items-center justify-between gap-2">
                        <div>
                            <h4 class="text-sm font-bold text-gray-900 dark:text-white flex items-center gap-1.5">
                                <i class="fas fa-key text-amber-500"></i> Account Backup &amp; Restore
                            </h4>
                            <p class="text-xs text-gray-500 dark:text-gray-400">Transfer credits &amp; unlocks between devices using a recovery code.</p>
                        </div>
                        <button id="generate-recovery-btn" type="button" class="shrink-0 px-3 py-1.5 rounded-lg bg-gray-900 hover:bg-black text-white text-xs font-bold transition-colors dark:bg-amber-500 dark:hover:bg-amber-400 dark:text-gray-950">
                            Generate Code
                        </button>
                    </div>

                    <div id="recovery-code-box" class="hidden bg-amber-50 border border-amber-200 rounded-xl p-3 flex items-center justify-between gap-2 dark:bg-amber-950/30 dark:border-amber-800/60">
                        <code id="recovery-code-display" class="text-sm font-mono font-bold tracking-wider text-amber-900 dark:text-amber-300 select-all"></code>
                        <button id="copy-recovery-btn" type="button" aria-label="Copy recovery code" class="px-2.5 py-1 rounded-lg bg-amber-500 hover:bg-amber-600 text-white text-xs font-bold transition-colors">
                            <i class="fas fa-copy mr-1"></i>Copy
                        </button>
                    </div>

                    <div class="flex items-center gap-2">
                        <label for="recover-code-input" class="sr-only">Recovery Code</label>
                        <input id="recover-code-input" type="text" maxlength="19" placeholder="ZX-XXXX-XXXX-XXXX" autocomplete="off"
                            class="flex-1 px-3 py-2 rounded-xl border border-gray-200 bg-gray-50 text-xs font-mono uppercase tracking-wider text-gray-900 focus:outline-none focus:ring-2 focus:ring-amber-400 dark:bg-gray-800 dark:border-gray-700 dark:text-white">
                        <button id="recover-account-btn" type="button" class="px-3.5 py-2 rounded-xl bg-gray-100 hover:bg-gray-200 text-gray-800 text-xs font-bold transition-colors dark:bg-gray-800 dark:hover:bg-gray-700 dark:text-gray-100">
                            Restore
                        </button>
                    </div>
                </section>
            </div>
        </div>
    </div>

    <!-- ═══════════════════════════════════════════
         PURCHASE SUCCESS & BACKUP KEY MODAL
         ═══════════════════════════════════════════ -->
    <div id="purchase-success-modal" class="fixed inset-0 z-[180] hidden items-center justify-center p-4 modal-backdrop">
        <div class="bg-white rounded-3xl w-full max-w-lg max-h-[90vh] flex flex-col overflow-hidden shadow-2xl dark:bg-gray-900 dark:border dark:border-gray-800">
            <!-- Header banner with celebratory gradient -->
            <div class="relative shrink-0 bg-gradient-to-r from-emerald-500 via-teal-500 to-amber-500 p-6 md:p-8 text-center text-white">
                <div class="absolute inset-0 bg-black/10 pointer-events-none"></div>
                <button id="close-purchase-success-x" type="button" aria-label="Close modal" class="absolute top-4 right-4 z-20 w-10 h-10 bg-white/20 hover:bg-white/30 text-white rounded-full flex items-center justify-center transition-all duration-300 backdrop-blur-sm">
                    <i class="fas fa-times" aria-hidden="true"></i>
                </button>
                <div class="relative z-10">
                    <div class="w-16 h-16 mx-auto mb-3 bg-white/20 rounded-2xl flex items-center justify-center backdrop-blur-sm shadow-inner text-3xl">
                        <i class="fas fa-circle-check text-white" aria-hidden="true"></i>
                    </div>
                    <h3 class="text-2xl md:text-3xl font-black mb-1">Payment Successful!</h3>
                    <p id="purchase-success-status-text" class="text-white/95 text-sm font-medium">Your credit balance has been updated.</p>
                </div>
            </div>

            <!-- Body -->
            <div class="p-6 flex-1 min-h-0 overflow-y-auto space-y-4">
                <!-- Backup key highlight notice -->
                <div class="bg-amber-50 dark:bg-amber-950/40 border border-amber-200 dark:border-amber-800/60 rounded-2xl p-4">
                    <div class="flex items-start gap-3">
                        <div class="w-8 h-8 rounded-lg bg-amber-500 text-black flex items-center justify-center shrink-0 mt-0.5 shadow-sm">
                            <i class="fas fa-key text-sm" aria-hidden="true"></i>
                        </div>
                        <div>
                            <h4 class="text-sm font-bold text-amber-900 dark:text-amber-200">IMPORTANT: Save Your Recovery Key!</h4>
                            <p class="text-xs text-amber-800/90 dark:text-amber-300/80 mt-1 leading-relaxed">
                                If you clear your browser cache, switch devices, or change browsers, this <strong>Recovery Key</strong> restores your credit balance and DTREASURE unlocks.
                            </p>
                        </div>
                    </div>

                    <!-- Monospace Code Box -->
                    <div class="mt-4 bg-white dark:bg-gray-950 border border-amber-300 dark:border-amber-700/80 rounded-xl p-3.5 space-y-2.5 shadow-inner">
                        <div class="flex items-center justify-between gap-2 pb-2 border-b border-gray-100 dark:border-gray-800">
                            <span class="text-[10px] uppercase font-bold text-gray-400 tracking-wider">Virtual Account ID</span>
                            <code id="purchase-success-account-id" class="font-mono text-xs font-bold text-gray-800 dark:text-gray-200 select-all">ZXA-....-....</code>
                        </div>
                        <div class="flex items-center justify-between gap-2">
                            <div class="min-w-0 flex-1">
                                <span class="block text-[10px] uppercase font-bold text-gray-400 tracking-wider">Recovery Key</span>
                                <span id="purchase-success-recovery-code" class="block font-mono text-base sm:text-lg md:text-xl font-black text-amber-600 dark:text-amber-400 tracking-wider truncate select-all">ZX-XXXX-XXXX-XXXX</span>
                            </div>
                            <button id="copy-purchase-recovery-btn" type="button" aria-label="Copy Recovery Key" class="shrink-0 px-3 py-2 rounded-lg bg-amber-500 hover:bg-amber-600 text-black font-bold text-xs transition-transform active:scale-95 flex items-center gap-1.5 shadow">
                                <i class="fas fa-copy" aria-hidden="true"></i>
                                <span id="copy-purchase-recovery-label">Copy</span>
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Action buttons -->
                <div class="space-y-2.5 pt-2">
                    <button id="download-purchase-receipt-btn" type="button" class="w-full px-4 py-3 bg-gray-900 hover:bg-black text-white dark:bg-white dark:text-black dark:hover:bg-gray-100 rounded-xl font-bold text-sm transition-all flex items-center justify-center gap-2 shadow hover:scale-[1.01] active:scale-95">
                        <i class="fas fa-file-arrow-down text-base text-amber-400 dark:text-amber-600" aria-hidden="true"></i>
                        <span>Download Receipt &amp; Backup File (.txt)</span>
                    </button>
                    <button id="close-purchase-success-btn" type="button" class="w-full px-4 py-2.5 bg-gray-100 hover:bg-gray-200 text-gray-700 dark:bg-gray-800 dark:hover:bg-gray-700 dark:text-gray-200 rounded-xl font-semibold text-xs transition-colors">
                        Done &amp; Continue Browsing
                    </button>
                </div>
            </div>
        </div>
    </div>

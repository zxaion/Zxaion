name = "ai"
main = "src/index.js"
compatibility_date = "2026-01-15"

[vars]
PAYPAL_ENV = "live" # Ubah ke "sandbox" untuk testing PayPal Sandbox

# Database D1
[[d1_databases]]
binding = "DB"
database_name = "zxwallpaper"
database_id = "10cce737-02cd-43b8-95d2-00e4efc2d215"

[triggers]
crons = ["*/15 * * * *"]   # Scan R2 → D1 otomatis setiap 15 menit (hemat CPU & D1 writes)

# R2 Buckets (Penyimpanan File)
[[r2_buckets]]
binding = "Zxaion_B"
bucket_name = "zxaionverse"

[[r2_buckets]]
binding = "ZX_BUCKET"
bucket_name = "zx-cloud2"

[[r2_buckets]]
binding = "TREASURE"
bucket_name = "d-treasures"

# ...
[observability]
enabled = false
head_sampling_rate = 1
redact_query_string = true

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[observability.traces]
enabled = false
head_sampling_rate = 1
persist = true

[observability.issue_detection]
enabled = true
# ...
